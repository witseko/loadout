name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-latest, os: macos, arch: arm64 }
          - { runner: macos-15-intel, os: macos, arch: x86_64 }
          - { runner: ubuntu-24.04, os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    defaults:
      run:
        shell: bash
    env:
      # Oldest macOS the binary runs on. The runner's own macOS is newer.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches SINGLET_VERSION
        run: |
          source_version=$(sed -n 's/.*SINGLET_VERSION = "\(.*\)";/\1/p' src/surfaces/cli.hpp)
          if [[ "v$source_version" != "$TAG" ]]; then
            echo "Tag $TAG does not match SINGLET_VERSION $source_version in src/surfaces/cli.hpp" >&2
            exit 1
          fi

      - name: Unit tests
        run: make test

      - name: Build release binary
        run: make clean release

      - name: Smoke test
        run: |
          ./bin/singlet --version
          [[ "$(./bin/singlet --version)" == "singlet ${TAG#v}" ]]

      - name: Package
        run: |
          package="singlet-${TAG}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "dist/$package"
          cp bin/singlet LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: singlet-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum singlet-*.tar.gz > SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section && /^\[.*\]: / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create release
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "singlet $TAG" \
            --notes-file release-notes.md
